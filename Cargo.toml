[package]
name = "agent-loop-orchestrator"
version = "0.1.0"
edition = "2024"
description = "Local, provider-neutral coding agent orchestrator"
license = "MIT"

[[bin]]
name = "agent-loop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.9"
uuid = { version = "1.18", features = ["v4", "serde"] }

