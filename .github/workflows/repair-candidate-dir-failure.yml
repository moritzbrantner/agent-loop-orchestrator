name: Repair candidate-directory failure path

on:
  push:
    branches:
      - fix/deterministic-worktree-validation-18
    paths:
      - .github/workflows/repair-candidate-dir-failure.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v6
        with:
          ref: fix/deterministic-worktree-validation-18
      - name: Patch candidate-directory failure handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/execution.rs')
          text = path.read_text()
          old = '''        fs::create_dir_all(&candidate_object_directory).with_context(|| {
            format!(
                "create candidate object directory {}",
                candidate_object_directory.display()
            )
        })?;
'''
          new = '''        if let Err(error) = fs::create_dir_all(&candidate_object_directory).with_context(|| {
            format!(
                "create candidate object directory {}",
                candidate_object_directory.display()
            )
        }) {
            let message = failure_with_cleanup(
                &work_item.repository_root,
                &worktree_path,
                error.to_string(),
            );
            return self.finish_failed(run, &run_directory, message);
        }
'''
          if old not in text:
              raise SystemExit('expected candidate-directory creation block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          git diff --check
      - name: Verify focused gate
        run: cargo test --all-targets
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/execution.rs
          git commit -m 'fix: fail claimed runs when candidate setup fails'
          git push origin HEAD:fix/deterministic-worktree-validation-18
