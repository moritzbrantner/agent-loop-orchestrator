name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo chmod u+s "$(command -v bwrap)"
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Check repository conformance
        uses: moritzbrantner/coding-tooling@190f06c17606b14919da8389867798f2ed9b9dc5
        with:
          operation: conformance
          bun-version: 1.4.0
          report-path: .artifacts/coding-tooling/conformance.json
      - name: Run full deterministic validation
        uses: moritzbrantner/coding-tooling@190f06c17606b14919da8389867798f2ed9b9dc5
        with:
          operation: run
          tier: full
          strict: "true"
          bun-version: 1.4.0
          report-path: .artifacts/coding-tooling/full.json
