name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +stable fmt --all --check
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +stable test --all-targets --all-features
      - name: Check setup scripts
        run: bash -n setup.sh scripts/setup.sh
