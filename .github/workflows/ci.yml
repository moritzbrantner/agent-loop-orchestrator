name: CI

on:
  pull_request:
  push:
    branches: [main, agent/generic-worker-context]

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - name: Install Bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          sudo chmod u+s "$(command -v bwrap)"
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +stable fmt --all
      - name: Commit formatting on temporary branch
        if: github.event_name == 'push' && github.ref_name == 'agent/generic-worker-context'
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/mod.rs
          git commit -m "Apply rustfmt to worker adapter"
          git push origin HEAD:agent/generic-worker-context
      - name: Lint
        run: cargo +stable clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo +stable test --all-targets --all-features
      - name: Check setup scripts
        run: bash -n setup.sh scripts/setup.sh
