name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-rust-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove infallible JSON expect paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/cli.rs")
          text = path.read_text()
          opening = "serde_json::to_string(&json!({"
          response_end = '}))\n            .expect("serialize control response")'
          error_end = '}))\n            .expect("serialize control error")'
          if text.count(opening) != 2 or text.count(response_end) != 1 or text.count(error_end) != 1:
              raise SystemExit("control JSON serialization shape changed; refusing broad replacement")
          text = text.replace(opening, "json!({")
          text = text.replace(response_end, '})\n            .to_string()')
          text = text.replace(error_end, '})\n            .to_string()')
          path.write_text(text)
          PY
      - name: Commit Rust conformance repair
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add src/cli.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove control serialization panic paths"
          git push origin "HEAD:${HEAD_REF}"
