name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  repair-rust-conformance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Remove infallible JSON expect paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/cli.rs")
          text = path.read_text()
          old_success = '''            serde_json::to_string(&json!({
                "schemaVersion": 1,
                "ok": true,
                "kind": kind,
                "data": data,
            }))
            .expect("serialize control response")'''
          new_success = '''            json!({
                "schemaVersion": 1,
                "ok": true,
                "kind": kind,
                "data": data,
            })
            .to_string()'''
          old_error = '''            serde_json::to_string(&json!({
                "schemaVersion": 1,
                "ok": false,
                "error": {
                    "code": control_error_code(&error),
                    "message": format!("{error:#}"),
                }
            }))
            .expect("serialize control error")'''
          new_error = '''            json!({
                "schemaVersion": 1,
                "ok": false,
                "error": {
                    "code": control_error_code(&error),
                    "message": format!("{error:#}"),
                }
            })
            .to_string()'''
          if text.count(old_success) != 1 or text.count(old_error) != 1:
              raise SystemExit("control JSON serialization shape changed; refusing broad replacement")
          path.write_text(text.replace(old_success, new_success).replace(old_error, new_error))
          PY
      - name: Commit Rust conformance repair
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add src/cli.rs
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Remove control serialization panic paths"
          git push origin "HEAD:${HEAD_REF}"
