name: CI

on:
  pull_request:

permissions:
  contents: write

jobs:
  normalize-bun-workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Generate root workspace lock
        run: |
          rm -f web/bun.lock web/bun.lockb
          bun install --lockfile-only --ignore-scripts
      - name: Commit Bun workspace boundary
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git add package.json bun.lock .coding-tooling.json
          git add -u web/bun.lock
          if git diff --cached --quiet; then
            echo "Bun workspace boundary already normalized."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Normalize Bun workspace boundary"
          git push origin "HEAD:${HEAD_REF}"
