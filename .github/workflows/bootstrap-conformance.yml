name: Bootstrap repository conformance

on:
  push:
    branches: [fix/repository-conformance-18]

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target
      - name: Check out coding-tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: 190f06c17606b14919da8389867798f2ed9b9dc5
          path: coding-tooling
      - name: Check out coding-agent-conventions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: moritzbrantner/coding-agent-conventions
          ref: 77c18b74035989da5a2f8c79ec138d2fcc012e32
          path: coding-agent-conventions
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Materialize repository foundation
        working-directory: coding-tooling
        run: >-
          bun src/cli.ts bootstrap apply
          --root "$GITHUB_WORKSPACE/target"
          --conventions-root "$GITHUB_WORKSPACE/coding-agent-conventions"
          --json
      - name: Verify managed convention snapshot
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/cli.ts" conventions check
          --root "$GITHUB_WORKSPACE/target"
          --json
      - name: Audit repository foundation
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/entry.ts" foundation audit
          --root "$GITHUB_WORKSPACE/target"
          --json
      - name: Commit generated foundation
        working-directory: target
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .coding-tooling.json conventions.json conventions.lock.json .conventions renovate.json
          if git diff --cached --quiet; then
            echo "Foundation is already materialized."
            exit 0
          fi
          git commit -m "Materialize deterministic repository foundation"
          git push origin "HEAD:${GITHUB_REF_NAME}"
