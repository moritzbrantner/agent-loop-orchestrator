name: Verify repository convergence

on:
  push:
    branches: [fix/repository-conformance-18]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: target
      - name: Check out coding-tooling
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: moritzbrantner/coding-tooling
          ref: 190f06c17606b14919da8389867798f2ed9b9dc5
          path: coding-tooling
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Provision declared repository environment
        working-directory: target
        run: ./scripts/codex-environment.sh setup
      - name: Verify managed convention snapshot
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/cli.ts" conventions check
          --root "$GITHUB_WORKSPACE/target"
          --json
      - name: Audit repository foundation
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/entry.ts" foundation audit
          --root "$GITHUB_WORKSPACE/target"
          --json
      - name: Run strict convergence tier
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/cli.ts" run
          --tier fast --strict --json
      - name: Exercise aggregate full tier
        working-directory: target
        run: >-
          bun "$GITHUB_WORKSPACE/coding-tooling/src/cli.ts" run
          --tier full --json
