name: Normalize dashboard formatting

on:
  push:
    branches: [fix/repository-conformance-18]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install locked dashboard dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Apply canonical dashboard formatting
        working-directory: web
        run: bun run format:write
      - name: Commit normalized dashboard sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/src/api.ts web/src/app.tsx web/src/main.tsx web/src/setup.tsx web/tsconfig.json web/vite.config.ts
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Dashboard formatting is already canonical."
            exit 0
          fi
          git commit -m "Normalize dashboard formatting"
          git push origin "HEAD:${GITHUB_REF_NAME}"
