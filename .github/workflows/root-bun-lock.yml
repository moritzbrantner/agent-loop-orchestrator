name: Materialize root Bun lock

on:
  push:
    branches: [fix/repository-conformance-18]

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Generate root lock
        run: bun install
      - name: Commit root lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "Root Bun lock is already current."
            exit 0
          fi
          git commit -m "Lock repository Bun toolchain metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"
